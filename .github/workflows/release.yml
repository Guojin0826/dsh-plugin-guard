name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # attach assets / create the GitHub Release
  id-token: write # npm provenance signing

jobs:
  release:
    name: Publish & release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # reads `packageManager` from package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to npm
        # `prepublishOnly` runs `npm run build && npm run build:types`.
        # `--access public` keeps the scoped package installable by anyone
        # (a scoped publish would otherwise default to restricted/private).
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true